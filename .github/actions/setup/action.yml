name: Setup
description: >-
  pnpm (version from "packageManager" in package.json), Node (version from
  .nvmrc), the pnpm store and Turborepo's cache restored from earlier runs,
  then the dependencies, installed exactly as in the lockfile.

inputs:
  turbo-cache-key:
    description: Name of the Turborepo cache for this job (each job caches its own tasks).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        # Caches pnpm's store (the downloaded packages), keyed by the lockfile:
        # an unchanged lockfile means no download at all.
        cache: pnpm

    # Turborepo skips a task (build, lint, test) whose inputs haven't changed
    # since a cached run, and replays its output. The key ends with the commit:
    # each run saves a new cache, and restores the most recent one.
    - if: inputs.turbo-cache-key != ''
      uses: actions/cache@v5
      with:
        path: .turbo/cache
        key: turbo-${{ inputs.turbo-cache-key }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ inputs.turbo-cache-key }}-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      # --frozen-lockfile: fails if package.json and pnpm-lock.yaml disagree,
      # instead of silently updating the lockfile.
      run: pnpm install --frozen-lockfile
