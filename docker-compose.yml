# Mementorize: the whole application in containers (phase 7).
#
#   docker compose up --build        web + api + database: http://localhost:3001
#   docker compose up -d postgres    database only, for `pnpm dev` (as before)
#
# Settings and secrets: .env file next to this one (copy .env.example).
#
# Who talks to whom:
#
#   browser --3001--> web --(frontend)--> api --(backend)--> postgres
#                                                 migrate --^
#
# Only web is published on the host (plus postgres, on 127.0.0.1 only, for
# `pnpm dev`). The API is reachable from the web container only: the browser
# never calls it directly (see apps/web/README.md), and web, which isn't on
# the backend network, can't reach the database.

name: mementorize

x-database-url: &database-url postgresql://${POSTGRES_USER:-mementorize}:${POSTGRES_PASSWORD:-mementorize}@postgres:5432/${POSTGRES_DB:-mementorize}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mementorize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mementorize}
      POSTGRES_DB: ${POSTGRES_DB:-mementorize}
    ports:
      - "127.0.0.1:5432:5432" # for `pnpm dev` on the host; not reachable from the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [backend]

  # One-shot: applies the pending migrations, then exits. The API only
  # starts once it has succeeded.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    # A minimal init (tini) runs as PID 1 and forwards signals to Node. As
    # PID 1 itself, Node would ignore the SIGTERM sent by `docker stop`
    # after Nest re-raises it, and Docker would kill it after 10 s.
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      # Required, checked by the API at startup (src/config/env.validation.ts).
      # Not with ${JWT_SECRET:?...}: compose would then refuse to run anything
      # without a .env, even `docker compose up -d postgres`.
      JWT_SECRET: ${JWT_SECRET:-}
      # Sessions (MEM-85): access token 15 min, renewal token 30 days (sliding).
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      # Administration console (MEM-82): off without ADMIN_JWT_SECRET.
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-7200}
      PORT: 3000
      # E-mail reminders (phase 11). Without SMTP_HOST, nothing is sent.
      # Locally: `docker compose --profile mail up` adds Mailpit (below).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Address of the app, for the links of the e-mails.
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3001}}
      # Pronunciation of the vocabulary (MEM-39), generated by Kokoro. Without
      # KOKORO_URL, the web app keeps the browser's voices. Locally:
      # `docker compose --profile tts up` adds Kokoro (below), with
      # KOKORO_URL=http://kokoro:8880 in .env. Set in production.
      KOKORO_URL: ${KOKORO_URL:-}
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Busybox wget (Alpine). /health also checks the database.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
      # Checked every second while starting, so that a new container is
      # declared healthy (and takes traffic, when deploying) without waiting
      # for the first 10 s interval.
      start_interval: 1s
    networks: [backend, frontend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      API_URL: http://api:3000 # the service name, resolved by Docker's DNS
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # /login needs neither a session nor the API: it answers as soon as the
      # Next.js server is up. The /tmp/drain test is for deployments: a
      # container about to be replaced creates that file, turns unhealthy,
      # and Traefik stops sending it requests before it's stopped
      # (docker-compose.prod.yml, deploy/README.md).
      test: ["CMD-SHELL", "test ! -f /tmp/drain && wget -qO /dev/null http://127.0.0.1:3001/login"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 30s
      start_interval: 1s
    networks: [frontend]

  # Local test mail server (phase 11), only with `--profile mail`: catches
  # every e-mail the API sends, readable at http://localhost:8025. With
  # SMTP_HOST=mailpit and SMTP_PORT=1025 in .env (and 127.0.0.1 instead of
  # mailpit for `pnpm dev`).
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: [mail]
    ports:
      - "127.0.0.1:8025:8025" # web interface
      - "127.0.0.1:1025:1025" # SMTP, for `pnpm dev`
    networks: [backend]

  # Kokoro (MEM-39): speech synthesis, the free Kokoro-82M model (Apache
  # 2.0) behind an OpenAI-compatible API. Only the API calls it, to generate
  # the pronunciation of each vocabulary item once; never published. The
  # model is in the image (about 1.6 GB compressed). Locally only with
  # `--profile tts`; always in production (docker-compose.prod.yml).
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
    profiles: [tts]
    restart: unless-stopped
    # The VPS has 3.7 GB of memory: Kokoro can't take the app's share. Over
    # the limit, it is stopped, and the app falls back on the browser's voices.
    mem_limit: 1536m
    environment:
      # DEBUG by default: several lines per word. Warnings and errors only
      # (plus uvicorn's one line per request).
      API_LOG_LEVEL: WARNING
    # Docker keeps container logs without limit by default: at most 3 × 10 MB.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [backend]

networks:
  backend:
  frontend:

volumes:
  pgdata:
