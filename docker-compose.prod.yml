# Production on the VPS (phases 8 and 10): adjustments on top of
# docker-compose.yml. Compose merges the two files: everything in
# docker-compose.yml applies, except what is changed here. On the server,
# COMPOSE_FILE in .env makes plain `docker compose ...` use both.
#
# Nothing is built on the server: the images are built by the CI and
# published on GitHub's registry (ghcr.io), tagged with the commit they come
# from. IMAGE_TAG, written to .env by each deployment, says which commit
# runs. Deployments are automatic (deploy/release.sh); the Traefik stack
# (deploy/traefik) and its "proxy" network are required. Guide:
# deploy/README.md.

services:
  postgres:
    # Not published at all on the server: only migrate and api, on the
    # backend network, reach the database. (Published ports bypass the
    # server's firewall: what isn't published can't be reached.)
    ports: !reset []

  migrate:
    build: !reset null
    image: ghcr.io/vincentagile/mementorize-migrate:${IMAGE_TAG:?IMAGE_TAG is missing in .env (written by deploy/release.sh)}

  api:
    build: !reset null
    image: ghcr.io/vincentagile/mementorize-api:${IMAGE_TAG:?IMAGE_TAG is missing in .env (written by deploy/release.sh)}
    environment:
      APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is missing in .env (see .env.example)}

  web:
    build: !reset null
    image: ghcr.io/vincentagile/mementorize-web:${IMAGE_TAG:?IMAGE_TAG is missing in .env (written by deploy/release.sh)}
    # Not published either: the only way in is Traefik, on ports 80/443.
    ports: !reset []
    networks: [frontend, proxy]
    labels:
      - traefik.enable=true
      # Requests for this domain go to this container...
      - traefik.http.routers.mementorize.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is missing in .env (see .env.example)}`)
      # ...over HTTPS only (HTTP is redirected by Traefik)...
      - traefik.http.routers.mementorize.entrypoints=websecure
      - traefik.http.routers.mementorize.tls.certresolver=letsencrypt
      # ...on the port the Next.js server listens on in the container.
      - traefik.http.services.mementorize.loadbalancer.server.port=3001
      # Run by `docker rollout` in the old container, once the new one is
      # healthy, before stopping it: /tmp/drain makes the old one unhealthy
      # (see its healthcheck), Traefik takes it out of the load balancer
      # (2 failed checks, 5 s apart, at most ~12 s), and the 20 s wait leaves
      # time for that, and for the requests in progress to finish.
      - docker-rollout.pre-stop-hook=touch /tmp/drain && sleep 20

networks:
  proxy:
    external: true # created once on the server, shared with Traefik
